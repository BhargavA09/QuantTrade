<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>QuantTrade Pro</title>
    <meta name="description" content="Advanced mobile trading platform with Monte Carlo simulations, Fuzzy Logic projections, Fourier signal filtering, and global trade tracking." />
    <meta property="og:title" content="QuantTrade Pro" />
    <meta property="og:description" content="Advanced mobile trading platform with Monte Carlo simulations, Fuzzy Logic projections, Fourier signal filtering, and global trade tracking." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('quant_theme') || localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#fafafa');
          } else {
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
