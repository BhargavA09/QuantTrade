plugins {
    id "com.github.node-gradle.node" version "7.1.0"
}

node {
    download = true
    version = "20.11.0"
}

task dev(type: NpmTask) {
    args = ['run', 'dev']
}

task build(type: NpmTask) {
    args = ['run', 'build']
}

task start(type: NpmTask) {
    args = ['run', 'start']
}

task lint(type: NpmTask) {
    args = ['run', 'lint']
}

task test(type: NpmTask) {
    args = ['run', 'test']
}
